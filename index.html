<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:Georgia,serif; background:#0d1b2a; color:#e8d5a3; min-height:100vh; }
.star { position:fixed; border-radius:50%; background:#d4a017; pointer-events:none; animation:twinkle 3s infinite alternate; }
@keyframes twinkle { from{opacity:0.15} to{opacity:0.65} }
.view { min-height:100vh; display:none; flex-direction:column; }
.view.active { display:flex; }
.header { background:rgba(0,0,0,0.35); border-bottom:1px solid rgba(212,160,23,0.25); padding:0.9rem 1.25rem; display:flex; align-items:center; justify-content:space-between; flex-shrink:0; }
.gold { color:#d4a017; }
.muted { color:#6a8099; }
.green { color:#81c784; }
.red { color:#ef9a9a; }
.card { background:rgba(255,255,255,0.05); border:1px solid rgba(212,160,23,0.25); border-radius:14px; padding:1.25rem; }
.btn-gold { width:100%; padding:0.85rem; background:linear-gradient(135deg,#d4a017,#f0c040); border:none; border-radius:10px; color:#0d1b2a; font-size:0.95rem; font-weight:bold; cursor:pointer; font-family:Georgia,serif; }
.btn-gold:disabled { background:rgba(212,160,23,0.2); color:#4a5568; cursor:not-allowed; }
.btn-ghost { padding:0.6rem 1.1rem; background:transparent; border:1px solid rgba(212,160,23,0.4); border-radius:8px; color:#d4a017; cursor:pointer; font-family:Georgia,serif; font-size:0.88rem; }
.btn-back { background:none; border:none; color:#d4a017; cursor:pointer; font-size:1.3rem; padding:0; }
.btn-green { padding:0.45rem 0.9rem; background:rgba(76,175,80,0.2); border:1px solid rgba(76,175,80,0.5); border-radius:8px; color:#81c784; cursor:pointer; font-family:Georgia,serif; font-size:0.82rem; }
.btn-red { padding:0.45rem 0.9rem; background:rgba(239,83,80,0.2); border:1px solid rgba(239,83,80,0.5); border-radius:8px; color:#ef9a9a; cursor:pointer; font-family:Georgia,serif; font-size:0.82rem; }
.input-field { width:100%; padding:0.75rem 1rem; background:rgba(255,255,255,0.08); border:1px solid rgba(212,160,23,0.4); border-radius:10px; color:#e8d5a3; font-size:0.95rem; outline:none; font-family:Georgia,serif; }
.input-sm { width:100%; padding:0.55rem 0.75rem; background:rgba(255,255,255,0.08); border:1px solid rgba(212,160,23,0.25); border-radius:8px; color:#e8d5a3; font-size:0.85rem; outline:none; font-family:Georgia,serif; }
.msg { padding:0.75rem 1rem; border-radius:10px; margin-bottom:1rem; font-size:0.9rem; display:none; }
.msg.success { background:rgba(76,175,80,0.15); border:1px solid rgba(76,175,80,0.4); color:#81c784; display:block; }
.msg.error { background:rgba(239,83,80,0.15); border:1px solid rgba(239,83,80,0.4); color:#ef9a9a; display:block; }
.msg.info { background:rgba(212,160,23,0.12); border:1px solid rgba(212,160,23,0.35); color:#f0c040; display:block; }
.progress-bar { height:4px; background:rgba(212,160,23,0.15); flex-shrink:0; }
.progress-fill { height:100%; background:linear-gradient(90deg,#d4a017,#f0c040); transition:width 0.5s; }
.scroll { flex:1; overflow-y:auto; padding:1.25rem; max-width:520px; margin:0 auto; width:100%; }
label { color:#6a8099; font-size:0.75rem; display:block; margin-bottom:0.3rem; }
.tab-bar { display:flex; border-bottom:1px solid rgba(212,160,23,0.2); flex-shrink:0; }
.tab { flex:1; padding:0.72rem; background:none; border:none; border-bottom:2px solid transparent; color:#6a8099; cursor:pointer; font-family:Georgia,serif; font-size:0.84rem; transition:all 0.2s; }
.tab.active { border-bottom-color:#d4a017; color:#d4a017; }
.t-spot { border-radius:14px; padding:1.1rem; margin-bottom:0.9rem; border:1px solid rgba(255,255,255,0.08); background:rgba(255,255,255,0.03); }
.t-spot.partial { border-color:rgba(212,160,23,0.35); background:rgba(212,160,23,0.05); }
.t-spot.full { border-color:rgba(76,175,80,0.4); background:rgba(76,175,80,0.06); }
.action-row { display:flex; gap:0.6rem; margin-top:0.75rem; }
.action-btn { flex:1; padding:0.6rem 0.5rem; border-radius:9px; font-family:Georgia,serif; font-size:0.82rem; cursor:pointer; border:none; font-weight:bold; text-align:center; transition:all 0.2s; }
.action-btn.photo { background:rgba(33,150,243,0.18); border:1px solid rgba(33,150,243,0.45); color:#90caf9; }
.action-btn.photo.done { background:rgba(33,150,243,0.08); color:#546e7a; cursor:default; }
.action-btn.code { background:rgba(212,160,23,0.18); border:1px solid rgba(212,160,23,0.45); color:#d4a017; }
.action-btn.code.done { background:rgba(76,175,80,0.1); border-color:rgba(76,175,80,0.4); color:#81c784; cursor:default; }
.badge { display:inline-block; padding:0.2rem 0.5rem; border-radius:20px; font-size:0.72rem; font-weight:bold; }
.badge.pending { background:rgba(255,193,7,0.2); color:#ffc107; }
.badge.approved { background:rgba(76,175,80,0.2); color:#81c784; }
.badge.rejected { background:rgba(239,83,80,0.2); color:#ef9a9a; }
.photo-card { background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.1); border-radius:13px; padding:1rem; margin-bottom:0.75rem; }
.photo-thumb { width:100%; max-height:200px; object-fit:cover; border-radius:8px; margin:0.6rem 0; }
.modal-bg { position:fixed; inset:0; background:rgba(0,0,0,0.85); display:none; align-items:center; justify-content:center; z-index:100; padding:1.5rem; }
.modal-bg.show { display:flex; }
.modal { background:#0d1b2a; border:1px solid rgba(212,160,23,0.4); border-radius:16px; padding:1.5rem; width:100%; max-width:420px; max-height:90vh; overflow-y:auto; }
.rank-card { background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.1); border-radius:13px; padding:0.9rem 1.1rem; display:flex; align-items:center; gap:0.9rem; margin-bottom:0.6rem; }
.rank-card.me { background:rgba(212,160,23,0.1); border-color:rgba(212,160,23,0.5); }
#video-container { border-radius:12px; overflow:hidden; border:2px solid #d4a017; position:relative; display:none; margin-bottom:1rem; }
#video-container.show { display:block; }
#qr-video { width:100%; display:block; max-height:260px; object-fit:cover; }
.scan-overlay { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; pointer-events:none; }
.scan-box { width:65%; aspect-ratio:1; border:2px solid rgba(212,160,23,0.9); border-radius:8px; box-shadow:0 0 0 9999px rgba(0,0,0,0.45); }
.scan-hint { position:absolute; bottom:0; left:0; right:0; padding:0.5rem; background:rgba(0,0,0,0.65); color:#d4a017; text-align:center; font-size:0.8rem; }
.scan-close { position:absolute; top:0.5rem; right:0.5rem; background:rgba(0,0,0,0.7); border:none; color:white; border-radius:50%; width:30px; height:30px; cursor:pointer; font-size:1rem; display:flex; align-items:center; justify-content:center; pointer-events:all; }
.grid2 { display:grid; grid-template-columns:1fr 1fr; gap:0.5rem; margin-bottom:0.5rem; }
.t-admin-card { background:rgba(255,255,255,0.04); border:1px solid rgba(212,160,23,0.18); border-radius:13px; padding:1.1rem; margin-bottom:0.75rem; }
.notif-dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:#ef5350; margin-left:4px; vertical-align:middle; }
</style>
</head>
<body>
<script>
for(let i=0;i<22;i++){const s=document.createElement('div');s.className='star';s.style.cssText=`width:${Math.random()*2.5+1}px;height:${Math.random()*2.5+1}px;left:${Math.random()*100}%;top:${Math.random()*100}%;animation-delay:${Math.random()*3}s;animation-duration:${Math.random()*2+2}s;`;document.body.appendChild(s);}
</script>

<!-- ========== WELCOME ========== -->
<div id="view-welcome" class="view active">
  <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem;">
    <div style="text-align:center;margin-bottom:2.5rem;">
      <div style="font-size:5rem;margin-bottom:0.5rem;filter:drop-shadow(0 0 20px rgba(212,160,23,0.5))">🗺️</div>
      <h1 style="color:#d4a017;font-size:2.3rem;margin-bottom:0.3rem;text-shadow:0 0 30px rgba(212,160,23,0.4)">보물찾기</h1>
      <p class="muted" style="font-size:0.9rem">회사 체육행사</p>
    </div>
    <div class="card" style="width:100%;max-width:380px;">
      <label>이름을 입력하세요</label>
      <input id="input-name" class="input-field" placeholder="홍길동" oninput="document.getElementById('btn-join').disabled=!this.value.trim()" onkeydown="if(event.key==='Enter')joinGame()" />
      <button id="btn-join" class="btn-gold" style="margin-top:0.9rem" onclick="joinGame()" disabled>🎯 게임 참가</button>
    </div>
    <div style="display:flex;gap:0.9rem;margin-top:1.25rem">
      <button class="btn-ghost" onclick="showView('leaderboard')">🏆 순위표</button>
      <button class="btn-ghost" onclick="showView('admin')">⚙️ 관리자</button>
    </div>
  </div>
</div>

<!-- ========== HUNT ========== -->
<div id="view-hunt" class="view">
  <div class="header">
    <div><div class="muted" style="font-size:0.73rem">탐험가</div><div class="gold" style="font-weight:bold" id="hunt-name">-</div></div>
    <div style="text-align:center"><div class="muted" style="font-size:0.73rem">완료</div><div class="gold" style="font-size:1.4rem;font-weight:bold" id="hunt-found">0/0</div></div>
    <div style="text-align:right"><div class="muted" style="font-size:0.73rem">총 점수</div><div class="gold" style="font-weight:bold" id="hunt-score">0점</div></div>
  </div>
  <div class="progress-bar"><div class="progress-fill" id="hunt-progress" style="width:0%"></div></div>
  <div class="scroll">
    <div id="hunt-msg" class="msg"></div>
    <div id="hunt-treasure-list"></div>
    <div style="display:flex;gap:0.75rem;margin-top:1rem">
      <button class="btn-ghost" style="flex:1;text-align:center" onclick="showView('leaderboard')">🏆 순위표</button>
      <button class="btn-ghost" onclick="showView('welcome')">← 나가기</button>
    </div>
  </div>
</div>

<!-- ========== CODE MODAL ========== -->
<div id="modal-code" class="modal-bg">
  <div class="modal">
    <h3 class="gold" style="margin-bottom:1rem" id="modal-code-title">🔑 보물 코드 입력</h3>
    <div id="video-container">
      <video id="qr-video" autoplay playsinline muted></video>
      <div class="scan-overlay"><div class="scan-box"></div></div>
      <div class="scan-hint">QR 코드를 네모 안에 맞춰주세요</div>
      <button class="scan-close" onclick="stopScan()">✕</button>
    </div>
    <div id="modal-code-msg" class="msg" style="margin-bottom:0.75rem"></div>
    <label>코드 입력</label>
    <input id="modal-code-input" class="input-field" style="text-transform:uppercase;letter-spacing:0.08em;margin-bottom:0.75rem" placeholder="예: TREE01" onkeydown="if(event.key==='Enter')submitCode()" />
    <div style="display:flex;gap:0.6rem;margin-bottom:0.75rem">
      <button class="btn-gold" style="flex:1" onclick="submitCode()">✓ 제출</button>
      <button id="btn-qr" class="btn-ghost" style="flex:1" onclick="toggleScan()">📷 QR 스캔</button>
    </div>
    <button class="btn-ghost" style="width:100%;text-align:center" onclick="closeCodeModal()">닫기</button>
  </div>
</div>

<!-- ========== PHOTO MODAL ========== -->
<div id="modal-photo" class="modal-bg">
  <div class="modal">
    <h3 class="gold" style="margin-bottom:0.5rem" id="modal-photo-title">📷 사진 인증</h3>
    <p class="muted" style="font-size:0.83rem;margin-bottom:1rem">이 장소에서 찍은 사진을 올려주세요. 관리자가 확인 후 점수가 부여돼요.</p>
    <div id="modal-photo-msg" class="msg" style="margin-bottom:0.75rem"></div>
    <div id="photo-preview-wrap" style="display:none;margin-bottom:0.75rem">
      <img id="photo-preview" style="width:100%;border-radius:10px;max-height:220px;object-fit:cover" />
    </div>
    <label>사진 선택 (카메라 또는 갤러리)</label>
    <input id="photo-input" type="file" accept="image/*" capture="environment" style="width:100%;padding:0.6rem;background:rgba(255,255,255,0.06);border:1px solid rgba(212,160,23,0.3);border-radius:8px;color:#e8d5a3;cursor:pointer;margin-bottom:0.75rem" onchange="previewPhoto(this)" />
    <button class="btn-gold" style="margin-bottom:0.6rem" onclick="submitPhoto()" id="btn-submit-photo" disabled>📤 제출하기</button>
    <button class="btn-ghost" style="width:100%;text-align:center" onclick="closePhotoModal()">닫기</button>
  </div>
</div>

<!-- ========== LEADERBOARD ========== -->
<div id="view-leaderboard" class="view">
  <div class="header">
    <button class="btn-back" onclick="goBackFromLB()">←</button>
    <h2 class="gold" style="font-size:1.15rem">🏆 실시간 순위표</h2>
    <div style="width:30px"></div>
  </div>
  <div class="scroll"><div id="leaderboard-list"></div></div>
</div>

<!-- ========== ADMIN ========== -->
<div id="view-admin" class="view">
  <div id="admin-login-wrap" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem">
    <div class="card" style="width:100%;max-width:360px">
      <h2 class="gold" style="text-align:center;margin-bottom:1.25rem">⚙️ 관리자 로그인</h2>
      <label>비밀번호</label>
      <input id="admin-pw" type="password" class="input-field" placeholder="비밀번호 입력" onkeydown="if(event.key==='Enter')adminLogin()" />
      <div id="admin-pw-err" style="color:#ef9a9a;font-size:0.82rem;margin-top:0.4rem;display:none">비밀번호가 틀렸어요</div>
      <button class="btn-gold" style="margin-top:0.9rem" onclick="adminLogin()">로그인</button>
      <button class="btn-ghost" style="width:100%;margin-top:0.6rem;text-align:center" onclick="showView('welcome')">← 돌아가기</button>
    </div>
  </div>
  <div id="admin-dash" style="display:none;flex-direction:column;flex:1;min-height:100vh">
    <div class="header">
      <div style="display:flex;align-items:center;gap:0.75rem">
        <button class="btn-back" onclick="showView('welcome')">←</button>
        <h2 class="gold" style="font-size:1.05rem">⚙️ 관리자</h2>
      </div>
      <div style="display:flex;align-items:center;gap:0.6rem">
        <span id="game-status-lbl" style="font-size:0.8rem;color:#ef9a9a">🔴 중지</span>
        <button id="btn-toggle-game" class="btn-ghost" style="font-size:0.8rem;padding:0.4rem 0.7rem" onclick="toggleGame()">시작</button>
      </div>
    </div>
    <div class="tab-bar">
      <button class="tab active" onclick="switchTab('treasures',this)">🗺️ 보물 설정</button>
      <button class="tab" onclick="switchTab('photos',this)" id="tab-photos-btn">📷 사진 승인</button>
      <button class="tab" onclick="switchTab('participants',this)">👥 참가자</button>
    </div>
    <div class="scroll">
      <div id="tab-treasures">
        <div id="admin-treasure-list"></div>
        <div style="color:#6a8099;font-size:0.78rem;padding:0.6rem 0.75rem;background:rgba(212,160,23,0.05);border-radius:8px;margin-top:0.5rem">
          💡 빠르기 보너스(코드): 1등 +50점 · 2등 +30점 · 3등 +20점 · 4등 +10점 · 5등 +5점
        </div>
        <button class="btn-gold" style="margin-top:1rem" onclick="saveTreasures()">💾 저장하기</button>
      </div>
      <div id="tab-photos" style="display:none">
        <div id="admin-photo-list"></div>
      </div>
      <div id="tab-participants" style="display:none">
        <div id="admin-participant-list"></div>
        <button onclick="resetAll()" style="width:100%;margin-top:1.25rem;padding:0.8rem;background:rgba(239,83,80,0.12);border:1px solid rgba(239,83,80,0.4);border-radius:10px;color:#ef9a9a;cursor:pointer;font-family:Georgia,serif;font-size:0.85rem">🗑️ 전체 참가자 초기화</button>
      </div>
    </div>
  </div>
</div>

<script>
// ====== STATE ======
const ADMIN_PASS = 'admin1234';
let currentPlayer = null;
let treasures = [];
let participants = [];
let photos = []; // [{id, name, treasureId, imageData, timestamp, status:'pending'|'approved'|'rejected'}]
let gameActive = false;
let adminUnlocked = false;
let editTreasures = [];
let scanning = false;
let scanStream = null;
let scanInterval = null;
let activeCodeTreasureId = null;
let activePhotoTreasureId = null;
let photoFileData = null;
let refreshTimer = null;

// ====== STORAGE ======
async function getS(key){try{const r=await window.storage.get(key,true);return r?JSON.parse(r.value):null;}catch{return null;}}
async function setS(key,val){try{await window.storage.set(key,JSON.stringify(val),true);}catch(e){console.error(e);}}

// ====== LOAD ======
async function loadAll(){
  const [t,p,g,ph]=await Promise.all([getS('hunt_t'),getS('hunt_p'),getS('hunt_g'),getS('hunt_ph')]);
  if(t)treasures=t;
  if(p){participants=p;if(currentPlayer){const u=p.find(x=>x.name===currentPlayer.name);if(u)currentPlayer=u;}}
  if(g!==null)gameActive=g;
  if(ph)photos=ph;
  refreshUI();
}
function startRefresh(){if(refreshTimer)clearInterval(refreshTimer);refreshTimer=setInterval(loadAll,4500);}

// ====== VIEWS ======
function showView(name){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById('view-'+name).classList.add('active');
  if(name==='leaderboard')renderLeaderboard();
  if(name==='admin')renderAdmin();
  if(name==='hunt')renderHunt();
  if(name!=='hunt')stopScan();
}
function goBackFromLB(){showView(currentPlayer?'hunt':'welcome');}

// ====== JOIN ======
async function joinGame(){
  const name=document.getElementById('input-name').value.trim();
  if(!name)return;
  await loadAll();
  let player=participants.find(p=>p.name===name);
  if(!player){
    player={name,photoFindings:[],codeFindings:[],totalPoints:0,joinTime:Date.now()};
    participants.push(player);
    await setS('hunt_p',participants);
  }
  currentPlayer=player;
  showView('hunt');
  startRefresh();
}

// ====== HUNT RENDER ======
function renderHunt(){
  if(!currentPlayer)return;
  const totalSpots=treasures.length;
  const completed=treasures.filter(t=>{
    const cf=currentPlayer.codeFindings.find(f=>f.treasureId===t.id);
    const pf=currentPlayer.photoFindings.find(f=>f.treasureId===t.id&&f.status==='approved');
    return cf||pf;
  }).length;
  document.getElementById('hunt-name').textContent=currentPlayer.name;
  document.getElementById('hunt-found').textContent=`${completed}/${totalSpots}`;
  document.getElementById('hunt-score').textContent=`${currentPlayer.totalPoints}점`;
  document.getElementById('hunt-progress').style.width=totalSpots?`${(completed/totalSpots)*100}%`:'0%';

  const list=document.getElementById('hunt-treasure-list');
  if(!gameActive){
    list.innerHTML=`<div style="text-align:center;padding:2.5rem;color:#6a8099"><div style="font-size:3rem;margin-bottom:0.75rem">⏳</div>관리자가 게임을 시작하면 시작돼요</div>`;
    return;
  }
  if(!treasures.length){
    list.innerHTML=`<div style="text-align:center;padding:2.5rem;color:#6a8099">관리자가 보물을 설정 중이에요...</div>`;
    return;
  }
  list.innerHTML=treasures.map((t,i)=>{
    const cf=currentPlayer.codeFindings.find(f=>f.treasureId===t.id);
    const pf=currentPlayer.photoFindings.find(f=>f.treasureId===t.id);
    const pfApproved=pf&&pf.status==='approved';
    const pfPending=pf&&pf.status==='pending';
    const pfRejected=pf&&pf.status==='rejected';
    const hasBoth=cf&&pfApproved;
    const hasAny=cf||pfApproved;
    const spotClass=hasBoth?'full':hasAny?'partial':'';
    const icon=hasBoth?'🏆':hasAny?'✅':'🔒';

    const photoLabel=pfApproved?`📷 사진인증 완료 (+${pf.points}점)`:pfPending?`📷 승인 대기중...`:pfRejected?`📷 반려됨 (재도전 가능)`:`📷 사진 인증 (${t.photoPoints}점)`;
    const photoDone=pfApproved||pfPending;
    const codeLabel=cf?`🔑 보물 발견! (+${cf.points}점)`:`🔑 코드/QR (${t.codePoints}점+보너스)`;
    const codeDone=!!cf;

    let scoreInfo='';
    if(hasBoth)scoreInfo=`<div style="color:#81c784;font-size:0.78rem;margin-top:0.4rem">🏆 사진+보물 모두 완료! 총 ${(pf.points||0)+(cf.points||0)}점 획득</div>`;
    else if(pfApproved&&!cf)scoreInfo=`<div style="color:#90caf9;font-size:0.78rem;margin-top:0.4rem">📷 사진 ${pf.points}점 획득 · 보물 코드도 찾아보세요!</div>`;
    else if(cf&&!pfApproved)scoreInfo=`<div style="color:#d4a017;font-size:0.78rem;margin-top:0.4rem">🔑 보물 ${cf.points}점 획득 · 사진 인증도 해보세요!</div>`;
    else if(pfPending)scoreInfo=`<div style="color:#ffc107;font-size:0.78rem;margin-top:0.4rem">⏳ 사진 승인 대기중...</div>`;

    return `<div class="t-spot ${spotClass}">
      <div style="display:flex;align-items:center;gap:0.6rem;margin-bottom:0.4rem">
        <span style="font-size:1.5rem">${icon}</span>
        <div style="flex:1">
          <div style="font-weight:bold;color:${hasAny?'#e8d5a3':'#8ea8c0'}">${hasAny?t.name:`보물 ${i+1}`}</div>
          ${(!hasAny&&t.hint)?`<div class="muted" style="font-size:0.76rem">💡 ${t.hint}</div>`:''}
        </div>
        <div style="text-align:right;font-size:0.78rem;color:#6a8099">${t.photoPoints+t.codePoints}점 만점</div>
      </div>
      ${scoreInfo}
      <div class="action-row">
        <button class="action-btn photo ${photoDone?'done':''}" onclick="${photoDone?'':''}" ${photoDone?'disabled':''} onclick="${!photoDone?`openPhotoModal('${t.id}')`:''}">${photoLabel}</button>
        <button class="action-btn code ${codeDone?'done':''}" ${codeDone?'disabled':''} onclick="${!codeDone?`openCodeModal('${t.id}')`:''}">${codeLabel}</button>
      </div>
    </div>`;
  }).join('');

  // Fix onclick (inline was getting complicated, use data attrs approach)
  document.querySelectorAll('.action-btn.photo:not(.done):not([disabled])').forEach((btn,i)=>{
    const id=treasures.filter(t=>{
      const pf=currentPlayer.photoFindings.find(f=>f.treasureId===t.id);
      return !(pf&&(pf.status==='approved'||pf.status==='pending'));
    })[i]?.id;
    if(id)btn.onclick=()=>openPhotoModal(id);
  });
  document.querySelectorAll('.action-btn.code:not(.done):not([disabled])').forEach((btn,i)=>{
    const id=treasures.filter(t=>!currentPlayer.codeFindings.find(f=>f.treasureId===t.id))[i]?.id;
    if(id)btn.onclick=()=>openCodeModal(id);
  });
}

// ====== CODE MODAL ======
function openCodeModal(treasureId){
  activeCodeTreasureId=treasureId;
  const t=treasures.find(x=>x.id===treasureId);
  document.getElementById('modal-code-title').textContent=`🔑 ${t?t.name:'보물'} 코드 입력`;
  document.getElementById('modal-code-input').value='';
  const msg=document.getElementById('modal-code-msg');msg.className='msg';msg.textContent='';
  document.getElementById('modal-code').classList.add('show');
}
function closeCodeModal(){
  document.getElementById('modal-code').classList.remove('show');
  stopScan();
  activeCodeTreasureId=null;
}

function calcBonus(order){return[50,30,20,10,5][order]||0;}

async function submitCode(){
  const raw=document.getElementById('modal-code-input').value.trim().toUpperCase();
  if(!raw||!currentPlayer||!activeCodeTreasureId)return;
  const t=treasures.find(x=>x.id===activeCodeTreasureId);
  if(!t){showCodeMsg('보물을 찾을 수 없어요.','error');return;}
  if(t.code.toUpperCase()!==raw){showCodeMsg('❌ 올바르지 않은 코드예요!','error');return;}
  const findOrder=participants.filter(p=>p.codeFindings.find(f=>f.treasureId===t.id)).length;
  const bonus=calcBonus(findOrder);
  const points=t.codePoints+bonus;
  const finding={treasureId:t.id,timestamp:Date.now(),points,findOrder};
  currentPlayer.codeFindings.push(finding);
  currentPlayer.totalPoints+=points;
  const idx=participants.findIndex(p=>p.name===currentPlayer.name);
  if(idx!==-1)participants[idx]=currentPlayer;
  await setS('hunt_p',participants);
  stopScan();
  document.getElementById('modal-code').classList.remove('show');
  const orderMsg=findOrder===0?' 🥇 첫 번째!':findOrder===1?' 🥈 두 번째!':findOrder===2?' 🥉 세 번째!':'';
  showHuntMsg(`🎉 "${t.name}" 발견! +${points}점${orderMsg}`,'success');
  renderHunt();
}
function showCodeMsg(txt,type){const el=document.getElementById('modal-code-msg');el.className=`msg ${type}`;el.textContent=txt;}
function showHuntMsg(txt,type){const el=document.getElementById('hunt-msg');el.className=`msg ${type}`;el.textContent=txt;clearTimeout(el._t);el._t=setTimeout(()=>{el.className='msg';},4500);}

// ====== QR SCAN ======
async function toggleScan(){
  if(scanning){stopScan();return;}
  if(!('BarcodeDetector' in window)){showCodeMsg('이 브라우저는 QR 스캔을 지원하지 않아요.','error');return;}
  try{
    const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
    scanStream=stream;
    const video=document.getElementById('qr-video');
    video.srcObject=stream;await video.play();
    document.getElementById('video-container').classList.add('show');
    document.getElementById('btn-qr').textContent='📷 중지';
    scanning=true;
    const det=new BarcodeDetector({formats:['qr_code']});
    scanInterval=setInterval(async()=>{
      try{const codes=await det.detect(video);if(codes.length>0){stopScan();document.getElementById('modal-code-input').value=codes[0].rawValue.toUpperCase();showCodeMsg('QR 인식! 제출 버튼을 눌러주세요.','info');}}catch(e){}
    },600);
  }catch(e){showCodeMsg('카메라 권한이 필요해요.','error');}
}
function stopScan(){
  scanning=false;
  if(scanInterval){clearInterval(scanInterval);scanInterval=null;}
  if(scanStream){scanStream.getTracks().forEach(t=>t.stop());scanStream=null;}
  const vc=document.getElementById('video-container');if(vc)vc.classList.remove('show');
  const btn=document.getElementById('btn-qr');if(btn)btn.textContent='📷 QR 스캔';
}

// ====== PHOTO MODAL ======
function openPhotoModal(treasureId){
  activePhotoTreasureId=treasureId;
  photoFileData=null;
  const t=treasures.find(x=>x.id===treasureId);
  document.getElementById('modal-photo-title').textContent=`📷 ${t?t.name:'장소'} 사진 인증`;
  document.getElementById('photo-input').value='';
  document.getElementById('photo-preview-wrap').style.display='none';
  const msg=document.getElementById('modal-photo-msg');msg.className='msg';msg.textContent='';
  document.getElementById('btn-submit-photo').disabled=true;
  document.getElementById('modal-photo').classList.add('show');
}
function closePhotoModal(){document.getElementById('modal-photo').classList.remove('show');activePhotoTreasureId=null;photoFileData=null;}

function previewPhoto(input){
  const file=input.files[0];
  if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    document.getElementById('photo-preview').src=e.target.result;
    document.getElementById('photo-preview-wrap').style.display='block';
  };
  reader.readAsDataURL(file);
  compressImage(file).then(data=>{
    photoFileData=data;
    document.getElementById('btn-submit-photo').disabled=false;
  });
}

function compressImage(file){
  return new Promise(resolve=>{
    const reader=new FileReader();
    reader.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        const canvas=document.createElement('canvas');
        const MAX=480;
        let w=img.width,h=img.height;
        if(w>MAX){h=Math.round(h*MAX/w);w=MAX;}
        canvas.width=w;canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg',0.65));
      };
      img.src=e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

async function submitPhoto(){
  if(!photoFileData||!activePhotoTreasureId||!currentPlayer)return;
  const t=treasures.find(x=>x.id===activePhotoTreasureId);
  // Check not already submitted
  const already=currentPlayer.photoFindings.find(f=>f.treasureId===activePhotoTreasureId);
  if(already&&already.status==='pending'){showPhotoMsg('이미 승인 대기중이에요!','info');return;}
  if(already&&already.status==='approved'){showPhotoMsg('이미 승인된 사진이에요!','info');return;}

  const photoEntry={
    id:`ph_${Date.now()}_${Math.random().toString(36).substr(2,5)}`,
    name:currentPlayer.name,
    treasureId:activePhotoTreasureId,
    treasureName:t?t.name:'보물',
    imageData:photoFileData,
    timestamp:Date.now(),
    status:'pending',
  };
  photos.push(photoEntry);
  await setS('hunt_ph',photos);

  // Update participant
  const finding={treasureId:activePhotoTreasureId,photoId:photoEntry.id,status:'pending',points:0,submittedAt:Date.now()};
  if(already&&already.status==='rejected'){
    const fi=currentPlayer.photoFindings.findIndex(f=>f.treasureId===activePhotoTreasureId);
    currentPlayer.photoFindings[fi]=finding;
  } else {
    currentPlayer.photoFindings.push(finding);
  }
  const idx=participants.findIndex(p=>p.name===currentPlayer.name);
  if(idx!==-1)participants[idx]=currentPlayer;
  await setS('hunt_p',participants);
  closePhotoModal();
  showHuntMsg('📷 사진 제출 완료! 관리자 승인을 기다려주세요.','info');
  renderHunt();
}
function showPhotoMsg(txt,type){const el=document.getElementById('modal-photo-msg');el.className=`msg ${type}`;el.textContent=txt;}

// ====== LEADERBOARD ======
function renderLeaderboard(){
  const sorted=[...participants].sort((a,b)=>{
    if(b.totalPoints!==a.totalPoints)return b.totalPoints-a.totalPoints;
    const aT=Math.max(...[...a.codeFindings,...a.photoFindings].map(f=>f.timestamp||f.submittedAt||0),0);
    const bT=Math.max(...[...b.codeFindings,...b.photoFindings].map(f=>f.timestamp||f.submittedAt||0),0);
    return aT-bT;
  });
  const medals=['🥇','🥈','🥉'];
  const el=document.getElementById('leaderboard-list');
  if(!sorted.length){el.innerHTML=`<div style="text-align:center;padding:3rem;color:#6a8099"><div style="font-size:3rem;margin-bottom:0.75rem">🗺️</div>아직 점수를 획득한 사람이 없어요!</div>`;return;}
  el.innerHTML=sorted.map((p,i)=>{
    const isMe=currentPlayer?.name===p.name;
    const photoCount=p.photoFindings.filter(f=>f.status==='approved').length;
    const codeCount=p.codeFindings.length;
    return `<div class="rank-card ${isMe?'me':i===0?'first':''}">
      <div style="font-size:${i<3?'1.8':'0.9'}rem;min-width:2.5rem;text-align:center;color:${i>=3?'#4a5568':'inherit'}">${i<3?medals[i]:`${i+1}위`}</div>
      <div style="flex:1">
        <div style="color:${isMe?'#d4a017':'#e8d5a3'};font-weight:${isMe?'bold':'normal'}">${p.name}${isMe?' (나)':''}</div>
        <div class="muted" style="font-size:0.75rem;margin-top:0.2rem">📷×${photoCount} 🔑×${codeCount} / ${treasures.length}곳</div>
      </div>
      <div style="text-align:right">
        <div class="gold" style="font-weight:bold;font-size:1.15rem">${p.totalPoints}</div>
        <div class="muted" style="font-size:0.7rem">점</div>
      </div>
    </div>`;
  }).join('');
}

// ====== ADMIN ======
function adminLogin(){
  if(document.getElementById('admin-pw').value===ADMIN_PASS){
    adminUnlocked=true;
    document.getElementById('admin-login-wrap').style.display='none';
    document.getElementById('admin-dash').style.display='flex';
    initEditTreasures();renderAdminPhotos();renderAdminParticipants();updateGameStatus();
  }else{document.getElementById('admin-pw-err').style.display='block';}
}
function renderAdmin(){
  if(adminUnlocked){
    document.getElementById('admin-login-wrap').style.display='none';
    document.getElementById('admin-dash').style.display='flex';
    updateGameStatus();renderAdminPhotos();renderAdminParticipants();
  }
}
function updateGameStatus(){
  document.getElementById('game-status-lbl').textContent=gameActive?'🟢 진행중':'🔴 중지';
  document.getElementById('game-status-lbl').style.color=gameActive?'#81c784':'#ef9a9a';
  document.getElementById('btn-toggle-game').textContent=gameActive?'중지':'시작';
}
async function toggleGame(){gameActive=!gameActive;await setS('hunt_g',gameActive);updateGameStatus();}

function switchTab(name,btn){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));btn.classList.add('active');
  ['treasures','photos','participants'].forEach(n=>document.getElementById('tab-'+n).style.display=n===name?'block':'none');
  if(name==='photos')renderAdminPhotos();
  if(name==='participants')renderAdminParticipants();
}

function initEditTreasures(){
  editTreasures=treasures.length?JSON.parse(JSON.stringify(treasures)):
    Array.from({length:5},(_,i)=>({id:`t${i+1}`,name:`보물 ${i+1}`,code:`CODE${String(i+1).padStart(2,'0')}`,photoPoints:50,codePoints:100,hint:''}));
  renderAdminTreasures();
}
function renderAdminTreasures(){
  document.getElementById('admin-treasure-list').innerHTML=editTreasures.map((t,i)=>`
    <div class="t-admin-card">
      <div class="gold" style="font-size:0.85rem;font-weight:bold;margin-bottom:0.7rem">📍 보물 ${i+1}</div>
      <div class="grid2">
        <div><label>이름</label><input class="input-sm" value="${t.name}" onchange="editTreasures[${i}].name=this.value"/></div>
        <div><label>코드 (대문자)</label><input class="input-sm" value="${t.code}" style="text-transform:uppercase;letter-spacing:0.06em" oninput="this.value=this.value.toUpperCase();editTreasures[${i}].code=this.value"/></div>
      </div>
      <div class="grid2">
        <div><label>📷 사진 점수</label><input class="input-sm" type="number" value="${t.photoPoints}" onchange="editTreasures[${i}].photoPoints=Number(this.value)"/></div>
        <div><label>🔑 보물 점수</label><input class="input-sm" type="number" value="${t.codePoints}" onchange="editTreasures[${i}].codePoints=Number(this.value)"/></div>
      </div>
      <div><label>힌트 (선택)</label><input class="input-sm" value="${t.hint}" placeholder="위치 힌트 입력" onchange="editTreasures[${i}].hint=this.value"/></div>
    </div>`).join('');
}
async function saveTreasures(){treasures=JSON.parse(JSON.stringify(editTreasures));await setS('hunt_t',treasures);alert('✅ 저장되었습니다!');}

function renderAdminPhotos(){
  const pending=photos.filter(p=>p.status==='pending');
  const tabBtn=document.getElementById('tab-photos-btn');
  tabBtn.innerHTML=`📷 사진 승인${pending.length?`<span class="notif-dot"></span>`:''}`;
  const el=document.getElementById('admin-photo-list');
  if(!photos.length){el.innerHTML=`<div style="text-align:center;color:#6a8099;padding:3rem">제출된 사진이 없어요</div>`;return;}
  const sorted=[...photos].sort((a,b)=>b.timestamp-a.timestamp);
  el.innerHTML=sorted.map(ph=>`
    <div class="photo-card">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:0.5rem">
        <div>
          <div style="font-weight:bold;color:#e8d5a3">${ph.name}</div>
          <div class="muted" style="font-size:0.76rem">${ph.treasureName} · ${new Date(ph.timestamp).toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})}</div>
        </div>
        <span class="badge ${ph.status}">${ph.status==='pending'?'대기중':ph.status==='approved'?'승인됨':'반려됨'}</span>
      </div>
      <img class="photo-thumb" src="${ph.imageData}" />
      ${ph.status==='pending'?`
      <div style="display:flex;gap:0.6rem;margin-top:0.5rem">
        <button class="btn-green" style="flex:1" onclick="approvePhoto('${ph.id}')">✓ 승인</button>
        <button class="btn-red" style="flex:1" onclick="rejectPhoto('${ph.id}')">✕ 반려</button>
      </div>`:`<div class="muted" style="font-size:0.78rem;margin-top:0.4rem;text-align:center">${ph.status==='approved'?'✅ 승인 완료':'❌ 반려됨'}</div>`}
    </div>`).join('');
}

async function approvePhoto(photoId){
  const ph=photos.find(p=>p.id===photoId);if(!ph)return;
  ph.status='approved';
  await setS('hunt_ph',photos);
  // Give points to participant
  const t=treasures.find(x=>x.id===ph.treasureId);
  const points=t?t.photoPoints:50;
  const prt=participants.find(p=>p.name===ph.name);
  if(prt){
    const pf=prt.photoFindings.find(f=>f.treasureId===ph.treasureId);
    if(pf){pf.status='approved';pf.points=points;prt.totalPoints+=points;}
    await setS('hunt_p',participants);
    if(currentPlayer?.name===ph.name)currentPlayer=prt;
  }
  renderAdminPhotos();renderAdminParticipants();
}
async function rejectPhoto(photoId){
  const ph=photos.find(p=>p.id===photoId);if(!ph)return;
  ph.status='rejected';
  await setS('hunt_ph',photos);
  const prt=participants.find(p=>p.name===ph.name);
  if(prt){const pf=prt.photoFindings.find(f=>f.treasureId===ph.treasureId);if(pf)pf.status='rejected';await setS('hunt_p',participants);}
  renderAdminPhotos();
}

function renderAdminParticipants(){
  const sorted=[...participants].sort((a,b)=>b.totalPoints-a.totalPoints);
  const el=document.getElementById('admin-participant-list');
  if(!sorted.length){el.innerHTML=`<div style="text-align:center;color:#6a8099;padding:3rem">아직 참가자가 없어요</div>`;return;}
  el.innerHTML=sorted.map((p,i)=>{
    const ph=p.photoFindings.filter(f=>f.status==='approved').length;
    const cd=p.codeFindings.length;
    return`<div class="rank-card">
      <div class="muted" style="min-width:2rem;font-size:0.85rem">${i+1}위</div>
      <div style="flex:1"><div style="color:#e8d5a3">${p.name}</div><div class="muted" style="font-size:0.75rem">📷${ph} 🔑${cd}</div></div>
      <div class="gold" style="font-weight:bold">${p.totalPoints}점</div>
    </div>`;
  }).join('');
}
async function resetAll(){
  if(!confirm('모든 참가자 데이터를 초기화할까요?'))return;
  participants=[];photos=[];currentPlayer=null;
  await Promise.all([setS('hunt_p',[]),setS('hunt_ph',[])]);
  renderAdminParticipants();renderAdminPhotos();
  alert('초기화 완료!');
}

function refreshUI(){
  const cur=document.querySelector('.view.active');if(!cur)return;
  const id=cur.id;
  if(id==='view-hunt')renderHunt();
  if(id==='view-leaderboard')renderLeaderboard();
  if(id==='view-admin'&&adminUnlocked){renderAdminPhotos();renderAdminParticipants();updateGameStatus();}
}

// ====== INIT ======
loadAll().then(()=>startRefresh());
</script>
